name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Pack tarball
        run: |
          TARBALL=$(npm pack --json | jq -r '.[0].filename')
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Verify npx execution
        run: |
          npx --yes "./$TARBALL" --version
          npx --yes "./$TARBALL" --help

      - name: Install globally and verify bin resolves
        run: |
          npm install -g "./$TARBALL"
          which canvas-cli

      - name: Verify --version
        run: |
          VERSION=$(canvas-cli --version)
          echo "canvas-cli version: $VERSION"
          [ -n "$VERSION" ]

      - name: Verify --help
        run: canvas-cli --help

      - name: Verify graceful error without credentials
        run: |
          set +e
          OUTPUT=$(canvas-cli courses 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          echo "Exit code: $CODE"
          # Should exit non-zero but not crash (segfault = 139, abort = 134)
          [ "$CODE" -ne 0 ] && [ "$CODE" -lt 128 ]
          # Should contain actionable guidance (any of these keywords)
          echo "$OUTPUT" | grep -qiE "login|token|credential|configured|CANVAS_API_TOKEN|canvas-cli login"
